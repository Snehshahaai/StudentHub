<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .calculator {
            background-color: #222;
            padding: 20px;
            border-radius: 12px;
            width: 280px;
        }

        .display {
            background-color: #fff;
            text-align: right;
            padding: 15px;
            font-size: 28px;
            border-radius: 8px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 18px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-num {
            background-color: #444;
            color: white;
        }

        .btn-op {
            background-color: #f4a23a;
            color: white;
        }

        .btn-clear {
            background-color: #e74c3c;
            color: white;
        }

        .btn-eq {
            background-color: #2ecc71;
            color: white;
        }

        .btn-zero {
            grid-column: span 2;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="display" id="display">0</div>

        <div class="buttons">

            <button class="btn-clear" onclick="clearDisplay()">C</button>
            <button class="btn-op"    onclick="inputValue('%')">%</button>
            <button class="btn-op"    onclick="deleteLast()">⌫</button>
            <button class="btn-op"    onclick="inputValue('/')">÷</button>

            <button class="btn-num" onclick="inputValue('7')">7</button>
            <button class="btn-num" onclick="inputValue('8')">8</button>
            <button class="btn-num" onclick="inputValue('9')">9</button>
            <button class="btn-op"  onclick="inputValue('*')">×</button>

            <button class="btn-num" onclick="inputValue('4')">4</button>
            <button class="btn-num" onclick="inputValue('5')">5</button>
            <button class="btn-num" onclick="inputValue('6')">6</button>
            <button class="btn-op"  onclick="inputValue('-')">−</button>

            <button class="btn-num" onclick="inputValue('1')">1</button>
            <button class="btn-num" onclick="inputValue('2')">2</button>
            <button class="btn-num" onclick="inputValue('3')">3</button>
            <button class="btn-op"  onclick="inputValue('+')">+</button>

            <button class="btn-num btn-zero" onclick="inputValue('0')">0</button>
            <button class="btn-num" onclick="inputValue('.')">.</button>
            <button class="btn-eq"  onclick="calculate()">=</button>

        </div>

    </div>

    <script>

        // Store what the user types
        let expression = '';

        // Show value on display
        function inputValue(value) {
            if (expression === '0') {
                expression = value;
            } else {
                expression += value;
            }
            document.getElementById('display').innerText = expression;
        }

        // Calculate the result
        function calculate() {
            try {
                let result = eval(expression);
                document.getElementById('display').innerText = result;
                expression = String(result);
            } catch (e) {
                document.getElementById('display').innerText = 'Error';
                expression = '';
            }
        }

        // Clear the display
        function clearDisplay() {
            expression = '';
            document.getElementById('display').innerText = '0';
        }

        // Delete last character
        function deleteLast() {
            expression = expression.slice(0, -1);
            if (expression === '') {
                document.getElementById('display').innerText = '0';
            } else {
                document.getElementById('display').innerText = expression;
            }
        }

    </script>

</body>

</html>
