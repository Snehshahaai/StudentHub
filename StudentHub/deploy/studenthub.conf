# StudentHub - Apache virtual host for XAMPP
# See docs/deployment.md. Change the DocumentRoot path to where you cloned the repo.

# macOS XAMPP:   /Applications/XAMPP/xamppfiles/etc/extra/httpd-vhosts.conf
# Windows XAMPP: C:\xampp\apache\conf\extra\httpd-vhosts.conf

<VirtualHost *:80>
    ServerName studenthub.local
    DocumentRoot "/Applications/XAMPP/xamppfiles/htdocs/StudentHub"

    <Directory "/Applications/XAMPP/xamppfiles/htdocs/StudentHub">
        # AllowOverride All lets the .htaccess files in database/, php/ and uploads/ take effect
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog  "logs/studenthub-error.log"
    CustomLog "logs/studenthub-access.log" common
</VirtualHost>
