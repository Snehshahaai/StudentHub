<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | StudentHub</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

    <!-- Dynamic Notification Toast Container -->
    <div id="shToastContainer" class="sh-toast-container"></div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <i class="fas fa-graduation-cap"></i> StudentHub
            </a>

            <div class="d-flex align-items-center gap-2 ms-auto me-2 me-lg-0 order-lg-last">
                <button type="button" class="theme-toggle-btn" aria-label="Toggle Light Dark Theme">
                    <i class="fas fa-moon text-primary"></i>
                    <span class="theme-text d-none d-sm-inline">Dark</span>
                </button>

                <button class="sh-hamburger-btn" data-nav-target="shNavMenu" aria-label="Toggle Mobile Menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>

            <div class="sh-nav-menu collapse navbar-collapse" id="shNavMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html"><i class="fas fa-home me-1"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="student-dashboard.html"><i class="fas fa-chart-line me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="attendance.html"><i class="fas fa-user-check me-1"></i> Attendance</a></li>
                    <li class="nav-item"><a class="nav-link" href="assignments.html"><i class="fas fa-tasks me-1"></i> Assignments</a></li>
                    <li class="nav-item"><a class="nav-link" href="material.html"><i class="fas fa-book me-1"></i> Materials</a></li>
                    <li class="nav-item"><a class="nav-link" href="notices.html"><i class="fas fa-bell me-1"></i> Notices</a></li>
                    <li class="nav-item"><a class="nav-link" href="faq.html"><i class="fas fa-question-circle me-1"></i> FAQ</a></li>
                    <li class="nav-item"><a class="nav-link active" href="profile.html"><i class="fas fa-user me-1"></i> Profile</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Profile Section -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card p-4 shadow-sm border-0 glass-card">
                        <div class="card-body">
                            <div class="d-flex align-items-center gap-4 mb-4 pb-3 border-bottom flex-wrap">
                                <div class="position-relative">
                                    <div class="fs-1 text-primary bg-primary bg-opacity-10 p-4 rounded-circle text-center" style="width: 90px; height: 90px; display: flex; align-items: center; justify-content: center;">
                                        <i class="fas fa-user-graduate fs-2"></i>
                                    </div>
                                </div>
                                <div>
                                    <h3 class="mb-1">Sneh Shah</h3>
                                    <p class="text-muted mb-1"><i class="fas fa-graduation-cap me-1"></i> B.Tech Computer Engineering | Sem 6</p>
                                    <span class="badge bg-success"><i class="fas fa-shield-alt me-1"></i> Active Student Account</span>
                                </div>
                            </div>

                            <form onsubmit="event.preventDefault(); StudentHub.showNotification('Profile updated successfully!', 'success');">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Enrollment Number</label>
                                        <input type="text" class="form-control" value="2026CS108" readonly>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Department</label>
                                        <input type="text" class="form-control" value="Computer Engineering" readonly>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Email Address</label>
                                        <input type="email" class="form-control" value="snehshah@university.edu" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Phone Number</label>
                                        <input type="tel" class="form-control" value="+91 9876543210" required>
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label fw-bold">Address</label>
                                        <textarea class="form-control" rows="2">Ahmedabad, Gujarat, India</textarea>
                                    </div>

                                    <div class="col-12 d-flex justify-content-between align-items-center mt-4">
                                        <button type="button" class="btn btn-outline-warning" data-modal-target="changePasswordModal">
                                            <i class="fas fa-lock me-1"></i> Change Password
                                        </button>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fas fa-save me-1"></i> Save Changes
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Change Password Modal -->
    <div class="sh-modal-overlay" id="changePasswordModal">
        <div class="sh-modal-container">
            <div class="sh-modal-header">
                <h4><i class="fas fa-lock text-warning me-2"></i> Update Security Password</h4>
                <button class="sh-modal-close" aria-label="Close modal">&times;</button>
            </div>
            <div class="sh-modal-body">
                <form onsubmit="event.preventDefault(); StudentHub.closeModal('changePasswordModal'); StudentHub.showNotification('Password updated securely!', 'success');">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Current Password</label>
                        <input type="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">New Password</label>
                        <input type="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Confirm New Password</label>
                        <input type="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update Password</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="pt-4 pb-3">
        <div class="container text-center">
            <p class="mb-0">© 2026 StudentHub | Student Profile</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Main JS Engine -->
    <script src="../js/main.js"></script>
</body>

</html>
