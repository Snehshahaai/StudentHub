<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - StudentHub</title>
</head>

<body>

    <header>

        <h1>StudentHub</h1>

        <nav>
            <a href="../index.html">Home</a> |
            <a href="login.html">Login</a> |
            <a href="register.html">Register</a> |
            <a href="dashboard.html">Dashboard</a>
        </nav>

    </header>

    <hr>

    <main>

        <h2>Contact Us</h2>

        <form action="#" method="post">

            <label for="name">Full Name</label>
            <br>
            <input
                type="text"
                id="name"
                name="name"
                required>

            <br><br>

            <label for="email">Email Address</label>
            <br>
            <input
                type="email"
                id="email"
                name="email"
                required>

            <br><br>

            <label for="subject">Subject</label>
            <br>
            <input
                type="text"
                id="subject"
                name="subject"
                required>

            <br><br>

            <label for="message">Message</label>
            <br>
            <textarea
                id="message"
                name="message"
                rows="6"
                cols="40"
                required></textarea>

            <br><br>

            <button type="submit">Send Message</button>

            <button type="reset">Reset</button>

        </form>

        <hr>

        <h3>College Contact Information</h3>

        <p><strong>Email:</strong> support@studenthub.edu</p>

        <p><strong>Phone:</strong> +91 98765 43210</p>

        <p><strong>Address:</strong> ABC College, Ahmedabad, Gujarat</p>

    </main>

    <hr>

    <footer>

        <p>© 2026 StudentHub. All Rights Reserved.</p>

    </footer>

</body>

</html>
